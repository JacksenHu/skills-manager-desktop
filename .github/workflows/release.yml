name: Release

# 打 tag（v*）自动出 Windows 安装包并发布到 GitHub Releases
#（release 产物含 latest.yml，供已安装用户经 electron-updater 自动更新）

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史 tag 生成发布说明

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != package.json version $VERSION"; exit 1
          fi

      - name: Package & publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder 的 GitHub 上传器偶发静默丢大文件（如 114MB exe），这里用 gh
      # 显式补传/覆盖全部产物。上传前先清空旧 assets，避免改名/重跑后的残留混淆。
      - name: Upload artifacts (fallback, clobber)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          RID=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -n "$RID" ]; then
            for AID in $(gh api "repos/$GH_REPO/releases/$RID" --jq '.assets[].id'); do
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$AID" >/dev/null 2>&1 || true
            done
          fi
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # 转正 release（electron-builder 可能留在草稿态）——核心步骤，不带任何可失败 extras
      - name: Make release public
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          RID=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$RID" ]; then echo "release for $TAG not found"; exit 1; fi
          gh api -X PATCH "repos/$GH_REPO/releases/$RID" -F draft=false --jq '.tag_name + " published, draft=" + (.draft|tostring)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # 发布说明（尽力而为：最近 15 条提交；失败不阻塞发布）
      - name: Attach release notes (best effort)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          RID=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          NOTES=$(git log --pretty=format:'- %s' -15)
          echo "NOTES: $NOTES" | head -3
          gh api -X PATCH "repos/$GH_REPO/releases/$RID" -f body="$NOTES" --jq '.body' || echo "notes attach failed (non-blocking)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
