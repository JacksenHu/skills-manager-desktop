name: Release

# 打 tag（v*）自动出 Windows 安装包并发布到 GitHub Releases
#（release 产物含 latest.yml，供已安装用户经 electron-updater 自动更新）

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史 tag 生成发布说明

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != package.json version $VERSION"; exit 1
          fi

      # 纯构建。必须显式 --publish never：CI 里 GH_TOKEN + tag 会触发 electron-builder
      # 默认的 onTagOrDraft 自动发布（其上传器会静默丢大文件并产生重复 release）
      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recreate clean release (auto notes)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          # 删掉该 tag 名下的全部旧 release（含孤儿 draft），保证单份干净
          for RID in $(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GH_REPO/releases/$RID" >/dev/null 2>&1 || true
          done
          gh release create "$TAG" --title "$TAG" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # 上传产物：exe + latest.yml 必须；blockmap 可选（缺省时 electron-updater 走全量下载）
      - name: Upload artifacts
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" release/*.exe release/latest.yml --clobber
          for BM in release/*.exe.blockmap; do
            if [ -f "$BM" ]; then gh release upload "$TAG" "$BM" --clobber; fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # 防 draft 兜底（gh release create 默认非 draft，此步只为覆盖删 tag 重发等场景）
      - name: Ensure not draft
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          RID=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$RID" ]; then echo "release for $TAG not found"; exit 1; fi
          gh api -X PATCH "repos/$GH_REPO/releases/$RID" -F draft=false --jq '.tag_name + " draft=" + (.draft|tostring)' || echo "WARN: draft patch failed, release may already be public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
