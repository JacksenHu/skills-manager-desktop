name: Release

# 打 tag（v*）自动出 Windows 安装包并发布到 GitHub Releases
#（release 产物含 latest.yml，供已安装用户经 electron-updater 自动更新）

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != package.json version $VERSION"; exit 1
          fi

      - name: Package & publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder 的 GitHub 上传器偶发静默丢大文件（如 114MB exe），这里用 gh
      # 显式补传/覆盖全部产物，保证 exe + blockmap + latest.yml 三件套齐全
      - name: Upload artifacts (fallback, clobber)
        shell: bash
        run: |
          gh release upload "$(node -p "require('./package.json').version" | sed 's/^/v/')" \
            release/*.exe \
            release/*.exe.blockmap \
            release/latest.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # electron-builder 默认（或复用旧 draft）可能把 release 留在草稿态，这里强制转正并生成发布说明
      - name: Make release public
        shell: bash
        run: |
          gh release edit "v$(node -p "require('./package.json').version")" --draft=false --generate-notes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
