name: Release

# 打 tag（v*）自动出 Windows 安装包并发布到 GitHub Releases
#（release 产物含 latest.yml，供已安装用户经 electron-updater 自动更新）

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史 tag 生成发布说明

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != package.json version $VERSION"; exit 1
          fi

      # 纯构建，不走 electron-builder 上传器（其 GitHub 上传会静默丢大文件）
      - name: Build installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release (auto notes)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 && echo "release already exists" \
            || gh release create "$TAG" --title "$TAG" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # 上传前若无 latest.yml 则按 electron-updater 格式现生成（version/path/sha512）
      - name: Upload artifacts
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ ! -f release/latest.yml ]; then
            node -e "
              const { createHash } = require('crypto');
              const fs = require('fs');
              const version = process.argv[1];
              const file = fs.readdirSync('release').find((f) => f.endsWith('.exe'));
              const buf = fs.readFileSync('release/' + file);
              const sha = createHash('sha512').update(buf).digest('base64');
              fs.writeFileSync('release/latest.yml',
                'version: ' + version + '\nfiles:\n  - url: ' + file + '\n    sha512: ' + sha + '\n    size: ' + buf.length + '\npath: ' + file + '\nsha512: ' + sha + \"\nreleaseDate: '\" + new Date().toISOString() + \"'\n\");
            " "$(node -p "require('./package.json').version")"
          fi
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
